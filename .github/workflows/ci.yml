name: CI

# Runs on every pull request and on main. The suite targets test/fixture-app, so no RN project has
# to sit beside the checkout.

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npx prettier --check .

            - name: Test
              run: npm test
