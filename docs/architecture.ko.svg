  <text x="900" y="161" font-size="11" fill="#0284c7">네이티브 코드를 브라우저에서 돌린다</text>

  <text x="900" y="194" font-size="12" font-weight="700" fill="#0369a1">해석 계층</text>

  <rect x="900" y="202" width="400" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="914" y="219" font-size="12" font-weight="600" fill="#1e293b">별칭 해석</text>
  <text x="914" y="235" font-size="10.5" fill="#64748b">@ui · @lib · @screens — 대상 프로젝트 tsconfig 에서 읽음</text>
  <text x="1100" y="254" font-size="10" fill="#38bdf8" text-anchor="middle">▼</text>

  <rect x="900" y="256" width="400" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="914" y="273" font-size="12" font-weight="600" fill="#1e293b">react-native shim</text>
  <text x="914" y="289" font-size="10.5" fill="#64748b">react-native-web + TurboModule·NativeModules 다리</text>
  <text x="1100" y="308" font-size="10" fill="#38bdf8" text-anchor="middle">▼</text>

  <rect x="900" y="310" width="400" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="914" y="327" font-size="12" font-weight="600" fill="#1e293b">빈 스텁</text>
  <text x="914" y="343" font-size="10.5" fill="#64748b">analytics · 푸시 · 권한 · 저장소 · 공유 — export 는 진짜 패키지에서</text>
  <text x="1100" y="362" font-size="10" fill="#38bdf8" text-anchor="middle">▼</text>

  <rect x="900" y="364" width="400" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="914" y="381" font-size="12" font-weight="600" fill="#1e293b">Metro 전용 문법</text>
  <text x="914" y="397" font-size="10.5" fill="#64748b">require() 자산 → import · .svg → react-native-svg</text>
  <text x="1100" y="416" font-size="10" fill="#38bdf8" text-anchor="middle">▼</text>

  <rect x="900" y="418" width="400" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="914" y="435" font-size="12" font-weight="600" fill="#1e293b">reanimated worklet</text>
  <text x="914" y="451" font-size="10.5" fill="#64748b">대상 프로젝트의 babel 플러그인을 별도 단계로 돌림</text>
  <text x="1100" y="470" font-size="10" fill="#38bdf8" text-anchor="middle">▼</text>

  <rect x="900" y="472" width="400" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="914" y="489" font-size="12" font-weight="600" fill="#1e293b">RN 스타일 관용구</text>
  <text x="914" y="505" font-size="10.5" fill="#64748b">top: undefined → auto</text>
  <text x="1100" y="524" font-size="10" fill="#38bdf8" text-anchor="middle">▼</text>

  <rect x="900" y="526" width="400" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="914" y="543" font-size="12" font-weight="600" fill="#1e293b">앱 코드 우회</text>
  <text x="914" y="559" font-size="10.5" fill="#64748b">플랫폼 설정 · isProduction · AB 배정은 선언에서 읽음</text>

  <line x1="1100" y1="568" x2="1100" y2="596" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="900" y="600" width="400" height="90" rx="8" fill="#0369a1"/>
  <text x="914" y="630" font-size="13.5" font-weight="700" fill="#ffffff">렌더러 — react-native-web</text>
  <text x="914" y="652" font-size="11" fill="#e0f2fe">PreviewGrid: 변형 × 상태 × 기기 폭을 한 화면에</text>
  <text x="914" y="670" font-size="11" fill="#e0f2fe">mockQueries · wrappers · 앱 루트 Provider 주입</text>

  <!-- ───────── 그룹 간 화살표 ───────── -->
  <!-- 편집기 소스 → 대상 프로젝트 소스 -->
  <line x1="330" y1="220" x2="426" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="378" y="209" font-size="11" fill="#475569" text-anchor="middle" style="paint-order:stroke" stroke="#f8fafc" stroke-width="4">파일을 연다</text>

  <!-- CodeLens → 생성기 -->
  <path d="M 330 334 H 372 V 551 H 406" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="371" y="435" font-size="11" fill="#475569" text-anchor="middle" style="paint-order:stroke" stroke="#f8fafc" stroke-width="4">선언 없으면</text>
  <text x="371" y="451" font-size="11" fill="#475569" text-anchor="middle" style="paint-order:stroke" stroke="#f8fafc" stroke-width="4">초안 생성</text>

  <!-- 생성기 → 선언 파일 -->
  <path d="M 790 612 H 838 V 344 H 794" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="839" y="470" font-size="11" fill="#475569" text-anchor="middle" style="paint-order:stroke" stroke="#f8fafc" stroke-width="4">초안 저장</text>

  <!-- 대상 프로젝트 소스 → Vite -->
  <line x1="790" y1="214" x2="876" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="835" y="203" font-size="11" fill="#475569" text-anchor="middle" style="paint-order:stroke" stroke="#f8fafc" stroke-width="4">소스 import</text>

  <!-- 선언 파일 → Vite -->
  <line x1="790" y1="312" x2="876" y2="312" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="835" y="301" font-size="11" fill="#475569" text-anchor="middle" style="paint-order:stroke" stroke="#f8fafc" stroke-width="4">선언 import</text>

  <!-- 렌더러 → 패널 (iframe) -->
  <path d="M 1100 690 V 780 H 195 V 718" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="650" y="772" font-size="11" fill="#475569" text-anchor="middle" style="paint-order:stroke" stroke="#f8fafc" stroke-width="4">iframe 으로 렌더 결과 전달</text>

  <!-- 각주 -->
  <text x="40" y="830" font-size="11.5" fill="#64748b">대상 프로젝트는 읽기 전용 · 선언은 무시되는 경로로 symlink 되어 팀 저장소에 들어가지 않는다 · 픽셀 판정은 이 도구 밖 (COMPATIBILITY.md)</text>
</svg>
